services:
  # --- Infrastructure ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  es-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ES_INDEX_BATCH: phapluat-batch
      ES_INDEX_REALTIME: phapluat-realtime
    command: ["python", "scripts/init_elasticsearch.py"]
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # --- Spark ---
  spark-master:
    image: bitnami/spark:3.5
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    image: bitnami/spark:3.5
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2

  spark-job:
    build:
      context: .
      dockerfile: spark/Dockerfile
    depends_on:
      spark-master:
        condition: service_started
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
      es-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIO_ENDPOINT: minio:9000

  # --- Kafka Workers ---
  kafka-consumer:
    build:
      context: .
      dockerfile: kafka/Dockerfile
    depends_on:
      - kafka
      - minio
    env_file:
      - .env
    restart: on-failure

  csv-to-kafka:
    build:
      context: .
      dockerfile: kafka/Dockerfile
    depends_on:
      - kafka
    env_file:
      - .env
    volumes:
      - ./crawler/output:/app/crawler/output:ro
    command: ["python", "csv_to_kafka.py", "--csv", "/app/crawler/output/demo-data.csv"]
    restart: "no"
    profiles:
      - seed

  data-ingest:
    build:
      context: .
      dockerfile: kafka/Dockerfile
    depends_on:
      - kafka
      - minio
    env_file:
      - .env
    command: ["python", "minio_ingest.py"]
    restart: on-failure

  # --- Application ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_started
      es-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  minio-data:
  es-data:
