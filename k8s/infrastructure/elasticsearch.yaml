---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  namespace: law-chatbot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: law-chatbot
spec:
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
  selector:
    app: elasticsearch
---
# MinIO credentials are loaded into the ES keystore at pod startup so the
# repository-s3 module can read them. ES 8.x rejects inline access_key /
# secret_key in the snapshot repository body — keystore is the only path.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: law-chatbot
type: Opaque
stringData:
  access_key: "minioadmin"
  secret_key: "minioadmin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: law-chatbot
spec:
  replicas: 1
  # PVC is ReadWriteOnce; rolling update would race two pods for the data
  # lock. Recreate stops the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
        # Build an ES keystore that holds S3 credentials for the
        # repository-s3 module, copy it into a shared emptyDir, and mount
        # it read-only into the main ES container via subPath. Idempotent:
        # the keystore lives in emptyDir so it's regenerated on every pod
        # restart from the Secret.
        - name: load-keystore
          image: law-chatbot/elasticsearch:latest
          imagePullPolicy: Never
          command:
            - /bin/bash
            - -c
            - |
              set -e
              cd /usr/share/elasticsearch
              # Fresh keystore each pod start
              rm -f config/elasticsearch.keystore
              bin/elasticsearch-keystore create
              echo -n "$MINIO_ACCESS_KEY" | bin/elasticsearch-keystore add -x -f s3.client.default.access_key
              echo -n "$MINIO_SECRET_KEY" | bin/elasticsearch-keystore add -x -f s3.client.default.secret_key
              cp config/elasticsearch.keystore /keystore/elasticsearch.keystore
              chmod 660 /keystore/elasticsearch.keystore
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: access_key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secret_key
          volumeMounts:
            - name: keystore-shared
              mountPath: /keystore
      containers:
        - name: elasticsearch
          image: law-chatbot/elasticsearch:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9200
            - containerPort: 9300
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
            - name: keystore-shared
              mountPath: /usr/share/elasticsearch/config/elasticsearch.keystore
              subPath: elasticsearch.keystore
              readOnly: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "300m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: elasticsearch-pvc
        - name: keystore-shared
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: law-chatbot
spec:
  ports:
    - port: 5601
      targetPort: 5601
  selector:
    app: kibana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: law-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.12.2
          ports:
            - containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch:9200"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
# es-init: initialize Elasticsearch indices with kNN mappings
apiVersion: batch/v1
kind: Job
metadata:
  name: es-init
  namespace: law-chatbot
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-es
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Elasticsearch..."
              until curl -sf http://elasticsearch:9200/_cluster/health >/dev/null 2>&1; do
                echo "ES not ready, retrying in 5s..."
                sleep 5
              done
              echo "Elasticsearch is ready!"
      containers:
        - name: es-init
          image: law-chatbot/backend:latest
          imagePullPolicy: Never
          command: ["python", "scripts/init_elasticsearch.py"]
          env:
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
            - name: ES_INDEX
              value: "phapluat"
