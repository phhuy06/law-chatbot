---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  namespace: law-chatbot
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC: "van-ban-phap-luat"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  MINIO_BUCKET: "phapluat"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  ES_INDEX: "phapluat"
---
# Spark Master
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: law-chatbot
spec:
  ports:
    - name: spark
      port: 7077
      targetPort: 7077
    - name: webui
      port: 8080
      targetPort: 8080
  selector:
    app: spark-master
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: law-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
        - name: spark-master
          image: apache/spark:3.5.8-python3
          command: ["/bin/bash", "-c"]
          args: ["/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"]
          env:
            - name: SPARK_MASTER_HOST
              value: "spark-master"
          ports:
            - containerPort: 7077
            - containerPort: 8080
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
# Spark Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: law-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: apache/spark:3.5.8-python3
          command: ["/bin/bash", "-c"]
          args: ["/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"]
          env:
            - name: SPARK_WORKER_MEMORY
              value: "2g"
            - name: SPARK_WORKER_CORES
              value: "2"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
# Spark Streaming Job
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-job
  namespace: law-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-job
  template:
    metadata:
      labels:
        app: spark-job
    spec:
      initContainers:
        - name: wait-for-deps
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until curl -sf http://kafka:9092 >/dev/null 2>&1 || nc -z kafka 9092 2>/dev/null; do
                sleep 5
              done
              echo "Waiting for Elasticsearch..."
              until curl -sf http://elasticsearch:9200/_cluster/health >/dev/null 2>&1; do
                sleep 5
              done
              echo "Dependencies ready!"
      containers:
        - name: spark-job
          image: law-chatbot/spark:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: spark-config
          env:
            - name: SPARK_MASTER_URL
              value: "spark://spark-master:7077"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
# Spark Batch - manual trigger via Job
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-batch
  namespace: law-chatbot
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: spark-batch
    spec:
      restartPolicy: OnFailure
      containers:
        - name: spark-batch
          image: law-chatbot/spark:latest
          imagePullPolicy: Never
          command: ["python3", "-m", "spark.batch.pipeline"]
          envFrom:
            - configMapRef:
                name: spark-config
          env:
            - name: SPARK_MASTER_URL
              value: "spark://spark-master:7077"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
