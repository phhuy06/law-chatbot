---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: law-chatbot
data:
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  ES_INDEX: "phapluat"
  REDIS_URL: "redis://redis:6379/0"
  REDIS_CACHE_TTL: "3600"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: law-chatbot
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-change-me"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: law-chatbot
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: law-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: law-chatbot/backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
