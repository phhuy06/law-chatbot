---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: law-chatbot
data:
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  ES_INDEX: "phapluat"
  ES_AUDIT_INDEX: "phapluat-audit"
  REDIS_URL: "redis://redis:6379/0"
  REDIS_CACHE_TTL: "3600"
# NOTE: the `backend-secret` Secret is intentionally NOT defined here.
# k8s/start.sh creates it from your local .env (key: OPENAI_API_KEY) so the
# real key never lives in the repo. If you skip start.sh, create it manually:
#   kubectl -n law-chatbot create secret generic backend-secret \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: law-chatbot
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: law-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: law-chatbot/backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
