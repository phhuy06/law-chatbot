<head>
<meta charset="UTF-8" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF7EF;
    --paper-2: #F2EEE3;
    --ink: #1A1A1A;
    --ink-2: #3C3C3C;
    --ink-muted: #6D6A62;
    --accent:  #B0211F;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--paper); }
  body {
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 28px 60px;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    opacity: 0.028;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }

  .frame { max-width: 1440px; margin: 0 auto; }

  .diagram-wrap { background: var(--paper); padding: 0; position: relative; }
  svg.diag { display: block; width: 100%; height: auto; }
  svg.diag text { font-family: "IBM Plex Sans", sans-serif; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .serif { font-family: "Fraunces", serif; }

  /* ===== Info icon + tooltip ===== */
  .info-icon { cursor: help; }
  .info-icon circle { transition: fill 0.15s, stroke 0.15s; }
  .info-icon text { transition: fill 0.15s; pointer-events: none; user-select: none; }
  .info-icon:hover circle { fill: var(--accent); stroke: var(--accent); }
  .info-icon:hover text { fill: #FAF7EF; }

  .tooltip {
    position: fixed;
    display: none;
    max-width: 420px;
    background: #1F1E1A;
    color: #FAF7EF;
    padding: 14px 16px 13px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.55;
    z-index: 10000;
    box-shadow: 0 12px 32px rgba(0,0,0,0.22), 0 2px 6px rgba(0,0,0,0.12);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    white-space: pre-line;
  }
  .tooltip.show { opacity: 1; display: block; }
  .tooltip b { color: #F1C26E; font-weight: 600; }
  .tooltip i { color: #E6DFB0; font-style: italic; }
  .tooltip code {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 3px;
    color: #E6DFB0;
  }

  /* ===== Legend ===== */
  .legend {
    display: flex; flex-wrap: wrap; gap: 22px;
    justify-content: center;
    margin-top: 28px;
    font-size: 13px; color: var(--ink-muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .sw { width: 22px; height: 3px; display: inline-block; border-radius: 2px; }

  footer.meta {
    text-align: center;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #D8D2C2;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-muted);
  }
</style>
</head>

      ["b", "Hybrid search"], ": kNN boost 0.3 + chunk_text boost 5.0 + title boost 3.0, top_k=10.", ["br"],
      ["b", "Snapshot → MinIO"], ": ", ["code", "repository-s3"], " module bundled. ES 8.x chặn inline cred → ",
      ["b", "ES keystore"], " load qua initContainer ", ["code", "load-keystore"],

    fastapi: [
      ["b", "Python 3.11 async"], ". ", ["code", "POST /api/chat"], ":", ["br"],

      "(7) ", ["b", "Audit log"], " → ES ", ["code", "phapluat-audit"], ": ",

    frontend: [

    prometheus: [
      ["b", "Prometheus v2.48.0"], ". Scrape pods + services trong namespace ",

      ["b", "Manual one-shot"], ":", ["br"],

      ["code", "BATCH_FORCE=true"], " (TTL 24h tự xoá sau khi xong)"

  const render = (tokens, target) => {
    while (target.firstChild) target.removeChild(target.firstChild);
    for (const tok of tokens) {
      if (typeof tok === 'string') {
        target.appendChild(document.createTextNode(tok));
      } else if (Array.isArray(tok)) {
        const [tag, text] = tok;
        if (tag === 'br') {
          target.appendChild(document.createElement('br'));
        } else {
          const el = document.createElement(tag);
          el.textContent = text || '';
          target.appendChild(el);
        }
      }
    }
  };

  const tip = document.getElementById('tooltip');
  const icons = document.querySelectorAll('.info-icon');
  const PAD = 14;

  const show = (el) => {
    const key = el.getAttribute('data-key');
    const tokens = TT[key];
    if (!tokens) return;
    render(tokens, tip);
    tip.classList.add('show');
    const tRect = tip.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    let x = r.right + 12;
    let y = r.top + (r.height / 2) - (tRect.height / 2);
    if (x + tRect.width + PAD > window.innerWidth) x = r.left - tRect.width - 12;
    if (x < PAD) x = PAD;
    if (y < PAD) y = PAD;
    if (y + tRect.height + PAD > window.innerHeight) y = window.innerHeight - tRect.height - PAD;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  };
  const hide = () => tip.classList.remove('show');

  icons.forEach(el => {
    el.addEventListener('mouseenter', () => show(el));
    el.addEventListener('mouseleave', hide);
    el.addEventListener('focus', () => show(el));
    el.addEventListener('blur', hide);
    el.setAttribute('tabindex', '0');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hide();
  });
})();
</script>
</body>
</html>
